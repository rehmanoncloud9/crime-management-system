# ============================================================
# CMS Application Configuration
# ============================================================
# Database connection (used as fallback if db.properties
# does not set these values)
# ============================================================
db.host=localhost
db.port=3306
db.name=cms_db
db.user=root
db.password=YOUR_MYSQL_PASSWORD_HERE
db.ssl=false

# Application settings
app.name=CMS v5.0
app.default.precinct=Central
app.auto.backup=true
app.session.timeout.minutes=20
app.password.lockout.attempts=5
app.password.lockout.minutes=30
app.time.format=24H
app.timezone=UTC
app.evidence.storage.path=./data/evidence
app.model.path=./models
ai.sensitivity=75

# Support contact (shown on login screen - no hardcoded numbers)
app.support.email=admin@cms.local
# app.support.url=https://...

# ============================================================
# Default admin account (first-run only)
# Change these before deploying. After first login the admin
# MUST change their password — the defaults are never reused.
# ============================================================
app.admin.username=rehmanoncloud9
app.admin.badge=SYS-001
app.admin.email=admin@cms.local
app.admin.default.password=atifaslam
